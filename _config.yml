# Theme
remote_theme: sblisesivdin/biscuit

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

# Collections
collections:
  roasts:
    output: true
    permalink: /roasts/:path/
  subscriptions:
    output: true
    permalink: /subscriptions/:path/
  flights:
    output: true
    permalink: /flights/:path/
  custom:
    output: true
    permalink: /roasts/:path/

# Default layouts per collection
defaults:
  - scope:
      path: ""
    values:
      image: /images/social-preview-v2.png
  - scope:
      path: ""
      type: roasts
    values:
      layout: roast
  - scope:
      path: ""
      type: subscriptions
    values:
      layout: subscription
      category: subscriptions
  - scope:
      path: ""
      type: flights
    values:
      layout: default
  - scope:
      path: ""
      type: custom
    values:
      layout: default
      category: custom

category_order:
  - blend
  - seasonal
  - single origin
  - custom
  - subscriptions
  - flight

exclude:
  - README.md
  - ROAST_MAINTENANCE.md
  - DRY_OPTIMIZATION_RECOMMENDATIONS.md
  - Gemfile
  - Gemfile.lock
  - AGENTS.md
  - IMPLEMENTATION_PLAN.md
  - TODO.txt
  - run.sh
  - agy.sh
  - scripts
  - scratch
  - "*.bak"
  - "*-preview.html"
  - "preview-*.html"
  - social-preview-generator.html
  - roastmasters_beans.csv
  - assets/source-plates
