# Theme
remote_theme: sblisesivdin/biscuit

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

# Collections
collections:
  roasts:
    output: true
    permalink: /roasts/:path/

# Default layouts per collection
defaults:
  - scope:
      path: ""
    values:
      image: /images/social-preview-v2.png
  - scope:
      path: ""
      type: roasts
    values:
      layout: roast

category_order:
  - blend
  - seasonal
  - single origin
  - subscriptions
  - flight

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  # - preview-bags.html
