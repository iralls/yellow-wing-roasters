<!DOCTYPE html>
<html>

      <div style="max-width: 520px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e8e4db; border-radius: 14px; padding: 36px 28px; text-align: center; box-sizing: border-box;">

        <!-- Minimal Brand Lockup -->
        <div style="margin-bottom: 32px;">
          <a href="<?= siteUrl ?>" target="_blank" rel="noopener noreferrer" style="text-decoration: none; display: inline-block;">
            <img src="<?= siteUrl ?>/images/audubon-feather-transparent.png"
                 height="52"
                 alt="Yellow Wing Roasters"
                 style="height: 52px; width: auto; display: block; margin: 0 auto 8px;" />
            <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #f0c838; line-height: 1.2;">
              Yellow Wing
            </div>
            <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: #6f655a; margin-top: 2px;">

                 alt="<?= title ?>"
                 height="185"
                 style="height: 185px; max-width: 240px; width: auto; display: block; margin: 0 auto;" />
          </a>
          <? if (mascotName) { ?>
            <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #6f655a; margin-top: 10px;">
              <?= mascotName ?>
            </div>
          <? } ?>
        </div>

        <!-- Status & Category -->
        <div style="margin-bottom: 10px;">
          <span style="display: inline-block; background-color: <?= justHatchedBg ?>; color: <?= justHatchedColor ?>; font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding: 3px 10px; border-radius: 999px; vertical-align: middle;">

          </span>
          <span style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6f655a; margin-left: 8px; vertical-align: middle;">
            <?= category ?><? if (certificationLabel) { ?> &middot; <?= certificationLabel ?><? } ?>

        </div>

        <h1 style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 600; color: #2c1e14; line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 6px;">
          <?= title ?>
        </h1>
        <? if (subtitle) { ?>
          <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6f655a; margin-bottom: 8px;">

          </div>

        <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; color: #3a2a1d; margin: 10px 0 4px;">

        </div>
        <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; color: #6f655a; line-height: 1.55; margin: 0 auto 18px; max-width: 400px;">
          <?= tastingNotesFormatted ?>
        </div>

        <!-- Roast Level Dots & Name -->
        <div style="margin: 0 auto 28px;">
          <div style="letter-spacing: 3px; font-size: 12px; line-height: 1;">
            <?!= roastDotsHtml ?>
          </div>
          <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 10px; color: #6f655a; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 6px;">
            <?= roastLevelName ?>
          </div>
        </div>

        <!-- Optional Personal Intro Note -->
        <? if (introNote) { ?>
          <p style="max-width: 420px; margin: 0 auto 16px; font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.75; color: #2c1e14;">
            <?= introNote ?>
          </p>

        <p style="max-width: 420px; margin: 0 auto 32px; font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.75; color: #2c1e14;">
          <?= description ?>
        </p>

        <!-- Unboxed Metadata Row -->
        <div style="max-width: 460px; margin: 0 auto 34px; text-align: center;">
          <div style="display: inline-block; vertical-align: top; padding: 8px 16px; text-align: center;">

            </div>
            <div style="font-size: 13px; font-weight: 600; color: #2c1e14; line-height: 1.4;">

            </div>
          </div>

          <? if (terroirValue) { ?>
            <div style="display: inline-block; vertical-align: top; padding: 8px 16px; text-align: center;">
              <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #6f655a; margin-bottom: 4px;">
                <?= terroirLabel ?>
              </div>
              <div style="font-size: 13px; font-weight: 600; color: #2c1e14; line-height: 1.4;">

              Recommended Brew
            </div>
            <div style="font-size: 13px; font-weight: 600; color: #2c1e14; line-height: 1.4;">
              <?= brewingMethod ?>
            </div>
          </div>
        </div>

        <!-- Primary Pill CTA -->
        <div style="margin-bottom: 40px;">
          <a href="<?= roastUrl ?>"
             target="_blank"
             rel="noopener noreferrer"
             style="display: inline-block; background-color: #302010; color: #ffffff !important; font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; padding: 13px 30px; border-radius: 999px;">
            Explore <?= title ?> &rarr;
          </a>
        </div>

        <!-- Minimal Footer Sign-off -->
        <div>
          <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; color: #6f655a; margin-bottom: 4px;">

          <div style="font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #2c1e14; margin-bottom: 20px;">
