<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #2c1e14; background-color: #fdfbf7; padding: 20px; }
      .card { max-width: 500px; margin: 0 auto; background: #ffffff; border: 1px solid #e8e0d5; border-radius: 8px; padding: 24px; }
      .header { font-family: "Montserrat","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; font-size: 20px; color: #f0c838; border-bottom: 2px solid #e8e0d5; padding-bottom: 12px; margin-bottom: 20px; }
      .status-badge { display: inline-block; padding: 6px 14px; border-radius: 16px; font-weight: bold; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
      .status-delayed { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
      .status-roasted { background: #eef8fc; color: #0284c7; border: 1px solid #bae6fd; }
      .status-ready { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
      .status-delivered { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
      .status-cancelled { background: #fdf2f2; color: #c0392b; border: 1px solid #f8d7da; }
      .highlight { background: #f9f6f0; border-left: 4px solid #f0c838; padding: 12px; margin: 16px 0; }
      .note-box { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 6px; padding: 12px; margin: 16px 0; color: #92400e; font-size: 14px; }
      .footer { font-family: "Montserrat","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight: 900; font-size: 15px; color: #f0c838; margin-top: 24px; border-top: 1px solid #e8e0d5; padding-top: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <table border="0" cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif;">
          <tr>
            <td style="vertical-align: middle; padding-right: 12px;">
              <img src="cid:myResizedImage" height="60" alt="Logo" style="height: 60px; width: auto; display: block;" />
            </td>
            <td style="vertical-align: middle;">
              Yellow Wing Roasters
            </td>
          </tr>
        </table>
      </div>

      <div class="status-badge <?= statusBadgeClass ?>">
        Status: <?= status ?>
      </div>

      <h2 style="font-size: 18px; margin-top: 0; color: #2c1e14;"><?= statusTitle ?></h2>
      <p style="font-size: 15px; line-height: 1.5; color: #4a3b32;"><?= statusMessage ?></p>

      <? if (statusDetails && statusDetails.toString().trim() !== "") { ?>
      <div class="note-box">
        <strong><?= detailsLabel ?>:</strong> <?= statusDetails ?>
      </div>
      <? } ?>


      <div class="highlight">
        <strong>Order ID:</strong> #<?= orderId ?><br>
        <strong>Items:</strong> <?= items ?><br>
        <strong>Total:</strong> <?= cost ?><br>
        <strong>Delivery Method:</strong> <?= deliveryMethod ?>
      </div>

      <div style="text-align: center; margin: 24px 0;">
        <a href="https://yellowwingroasters.com/order/manage/?orderId=<?= orderId ?>&token=<?= manageToken ?>" 
           style="display: inline-block; background-color: #2c1e14; color: #fdfbf7; padding: 12px 24px; border-radius: 24px; text-decoration: none; font-weight: bold; font-family: 'Montserrat', Helvetica, Arial, sans-serif; font-size: 14px;">
          View / Manage Order &rarr;
        </a>
      </div>

      <div class="footer">
        Chirp,<br>
        <strong>Yellow Wing Roasters</strong>
      </div>
    </div>
  </body>
</html>
