<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_top">
    <style>
      body {
        margin: 0;
        padding: 20px;
        background-color: #fdfbf7;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: #2c1e14;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 500px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e8e0d5;
        border-radius: 8px;
        padding: 24px;
        box-sizing: border-box;
      }
      .header {
        font-family: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 20px;
        color: #f0c838;
        border-bottom: 2px solid #e8e0d5;
        padding-bottom: 12px;
        margin-bottom: 20px;
      }
      .highlight {
        background: #f9f6f0;
        border-left: 4px solid #f0c838;
        padding: 12px 14px;
        margin: 16px 0;
        line-height: 1.6;
        font-size: 14px;
      }
      .footer {
        font-family: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 15px;
        color: #f0c838;
        margin-top: 24px;
        border-top: 1px solid #e8e0d5;
        padding-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <table border="0" cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif; width: 100%;">
          <tr>
            <td style="vertical-align: middle; padding-right: 12px; width: 60px;">
              <img src="cid:myResizedImage"
                   height="60"
                   alt="Yellow Wing Roasters"
                   style="height: 60px; width: auto; display: block;" />
            </td>
            <td style="vertical-align: middle;">
              Yellow Wing Roasters
            </td>
          </tr>
        </table>
      </div>

      <p style="font-size: 15px; line-height: 1.5; color: #4a3b32; margin-top: 0;">
        Your order has been registered!
      </p>

      <div class="highlight">
        <strong>Order ID:</strong> #<?= orderId ?><br>
        <strong>Items:</strong> <?= items ?><br>
        <strong>Total:</strong> <?= cost ?><br>
        <strong>Delivery Method:</strong> <?= deliveryMethod ?>
      </div>

      <div style="text-align: center; margin: 24px 0;">
        <a href="https://yellowwingroasters.com/order/manage/?orderId=<?= orderId ?>&token=<?= manageToken ?>" 
           style="display: inline-block; background-color: #2c1e14; color: #fdfbf7; padding: 12px 24px; border-radius: 24px; text-decoration: none; font-weight: bold; font-family: 'Montserrat', Helvetica, Arial, sans-serif; font-size: 14px;">
          Manage Your Order &rarr;
        </a>
      </div>

      <p style="font-size: 14px; line-height: 1.5; color: #6e5e54;">
        We will email you back shortly to coordinate payment and pickup/delivery details.
      </p>

      <div class="footer">
        Chirp,<br>
        <strong>Yellow Wing Roasters</strong>
      </div>
    </div>
  </body>
</html>
