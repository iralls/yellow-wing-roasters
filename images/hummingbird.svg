  <path d="M47,28 C63,17 77,8 86,4" stroke="#2B332B" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M51,34 C65,24 77,16 83,11" stroke="#2B332B" stroke-width="1.1" stroke-linecap="round" fill="none"/>
