  <!-- Dark Eye & Characteristic White Postocular Spot -->
  <circle cx="33" cy="26" r="1.8" fill="#141814"/>
  <circle cx="32.5" cy="25.5" r="0.6" fill="#FFFFFF"/>
  <circle cx="36.5" cy="25" r="0.7" fill="#FFFFFF"/>

  <!-- Near Wing (sweeping high and back in hover) -->
  <path d="M39,34
           C47,21 63,7 86,2
           C90,1 92,3 90,5
           C78,17 63,34 51,44
           C43,49 37,45 39,34 Z"
