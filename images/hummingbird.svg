  <!-- Gorget feather luster accents -->
  <path d="M27,35 C31,37 36,39 40,40" stroke="#880E4F" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M28,38 C31,40 35,42 38,43" stroke="#880E4F" stroke-width="1.0" stroke-linecap="round" fill="none"/>

  <!-- Tiny Tucked Claws -->
  <path d="M52,60 L50,64 M52,60 L53,64 M52,60 L56,63" stroke="#1B221B" stroke-width="1.3" stroke-linecap="round" fill="none"/>

  <!-- Long Needle Bill -->
