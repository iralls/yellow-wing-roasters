           C54,23 66,33 74,47
           C82,59 84,65 80,67
           C72,70 60,65 50,58
           C40,51 32,43 28,37
           C26,34 27,31 28,29 Z"
        fill="#2E7D32"/>

  <!-- Soft White Collar & Underbelly -->
  <path d="M30,37
           C34,43 44,52 54,58
           C50,62 42,60 36,54
           C32,48 29,42 30,37 Z"
        fill="#F6F6F2"/>

