<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Puebla Plumage Cinco de Mayo Pattern (Little Mexican Flags) -->
  <g fill-opacity="0.22" stroke-opacity="0.25">
    
    <!-- 1. Little Mexican Flag (Top Left, tilted left) -->
    <g transform="translate(45, 30) rotate(-18) scale(0.85)">
      <!-- Flagpole -->
      <line x1="2" y1="2" x2="2" y2="34" stroke="#8c5e3c" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="2" cy="2" r="1.5" fill="#d4af37"/>
      <!-- Green Stripe -->
      <rect fill="#006847" x="3" y="4" width="9" height="18"/>
      <!-- White Stripe -->
      <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" x="12" y="4" width="9" height="18"/>
      <!-- Emblem Dot in Center -->
      <circle cx="16.5" cy="13" r="2" fill="#a67c52"/>
      <!-- Red Stripe -->
      <rect fill="#ce1126" x="21" y="4" width="9" height="18"/>
    </g>

    <!-- 2. Little Mexican Flag (Top Right, tilted right) -->
    <g transform="translate(165, 40) rotate(15) scale(0.85)">
      <line x1="2" y1="2" x2="2" y2="34" stroke="#8c5e3c" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="2" cy="2" r="1.5" fill="#d4af37"/>
      <rect fill="#006847" x="3" y="4" width="9" height="18"/>
      <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" x="12" y="4" width="9" height="18"/>
      <circle cx="16.5" cy="13" r="2" fill="#a67c52"/>
      <rect fill="#ce1126" x="21" y="4" width="9" height="18"/>
    </g>

    <!-- 3. Little Mexican Flag (Bottom Left, tilted right) -->
    <g transform="translate(45, 155) rotate(12) scale(0.85)">
      <line x1="2" y1="2" x2="2" y2="34" stroke="#8c5e3c" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="2" cy="2" r="1.5" fill="#d4af37"/>
      <rect fill="#006847" x="3" y="4" width="9" height="18"/>
      <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" x="12" y="4" width="9" height="18"/>
      <circle cx="16.5" cy="13" r="2" fill="#a67c52"/>
      <rect fill="#ce1126" x="21" y="4" width="9" height="18"/>
    </g>

    <!-- 4. Little Mexican Flag (Bottom Right, tilted left) -->
    <g transform="translate(165, 145) rotate(-15) scale(0.85)">
      <line x1="2" y1="2" x2="2" y2="34" stroke="#8c5e3c" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="2" cy="2" r="1.5" fill="#d4af37"/>
      <rect fill="#006847" x="3" y="4" width="9" height="18"/>
      <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" x="12" y="4" width="9" height="18"/>
      <circle cx="16.5" cy="13" r="2" fill="#a67c52"/>
      <rect fill="#ce1126" x="21" y="4" width="9" height="18"/>
    </g>

    <!-- Corner Wrap Flag (Seamless Tiling) -->
    <g transform="translate(-5, -5) scale(0.7)">
      <rect fill="#006847" x="3" y="4" width="9" height="18"/>
      <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" x="12" y="4" width="9" height="18"/>
      <rect fill="#ce1126" x="21" y="4" width="9" height="18"/>
    </g>
    <g transform="translate(235, -5) scale(0.7)">
      <rect fill="#006847" x="3" y="4" width="9" height="18"/>
      <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" x="12" y="4" width="9" height="18"/>
      <rect fill="#ce1126" x="21" y="4" width="9" height="18"/>
    </g>
    <g transform="translate(-5, 235) scale(0.7)">
      <rect fill="#006847" x="3" y="4" width="9" height="18"/>
      <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" x="12" y="4" width="9" height="18"/>
      <rect fill="#ce1126" x="21" y="4" width="9" height="18"/>
    </g>
    <g transform="translate(235, 235) scale(0.7)">
      <rect fill="#006847" x="3" y="4" width="9" height="18"/>
      <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" x="12" y="4" width="9" height="18"/>
      <rect fill="#ce1126" x="21" y="4" width="9" height="18"/>
    </g>

    <!-- Festive Confetti Accents -->
    <circle cx="120" cy="115" r="2.5" fill="#006847"/>
    <path fill="#ce1126" d="M120 35l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z"/>

  </g>
</svg>
