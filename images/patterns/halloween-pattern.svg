<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Halloween Pattern (Friendly Little Ghosts & Smooth Classic Pumpkins) -->
  <g fill-opacity="0.18" stroke-opacity="0.20">
    
    <!-- 1. Small Friendly Ghost (Top Left) -->
    <g transform="translate(45, 30) scale(0.65)">
      <path fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" d="M 16 2 C 7 2, 2 9, 2 20 C 2 27, 4 34, 7 34 C 9 34, 10 30, 12 30 C 14 30, 15 34, 17 34 C 19 34, 20 30, 22 30 C 24 30, 25 34, 27 34 C 30 34, 30 27, 30 20 C 30 9, 25 2, 16 2 Z"/>
      <circle cx="11" cy="14" r="2" fill="#1e293b"/>
      <circle cx="21" cy="14" r="2" fill="#1e293b"/>
      <ellipse cx="16" cy="20" rx="1.8" ry="2.5" fill="#1e293b"/>
    </g>

    <!-- 2. Smooth Pumpkin (Top Right) -->
    <g transform="translate(165, 38) rotate(12) scale(0.75)">
      <!-- Stem -->
      <path fill="#4a7c59" d="M 11 1 C 10 0, 14 0, 14 5 L 11 5 Z"/>
      <!-- Smooth Squat Pumpkin Body -->
      <path fill="#ff6b00" d="M 12 5 C 4 5, 0 10, 0 17 C 0 25, 6 29, 12 29 C 18 29, 24 25, 24 17 C 24 10, 20 5, 12 5 Z"/>
    </g>

    <!-- 3. Smooth Pumpkin (Bottom Left) -->
    <g transform="translate(40, 155) rotate(-15) scale(0.75)">
      <path fill="#4a7c59" d="M 11 1 C 10 0, 14 0, 14 5 L 11 5 Z"/>
      <path fill="#ff6b00" d="M 12 5 C 4 5, 0 10, 0 17 C 0 25, 6 29, 12 29 C 18 29, 24 25, 24 17 C 24 10, 20 5, 12 5 Z"/>
    </g>

    <!-- 4. Small Friendly Ghost (Bottom Right) -->
    <g transform="translate(165, 145) scale(0.65)">
      <path fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" d="M 16 2 C 7 2, 2 9, 2 20 C 2 27, 4 34, 7 34 C 9 34, 10 30, 12 30 C 14 30, 15 34, 17 34 C 19 34, 20 30, 22 30 C 24 30, 25 34, 27 34 C 30 34, 30 27, 30 20 C 30 9, 25 2, 16 2 Z"/>
      <circle cx="11" cy="14" r="2" fill="#1e293b"/>
      <circle cx="21" cy="14" r="2" fill="#1e293b"/>
      <ellipse cx="16" cy="20" rx="1.8" ry="2.5" fill="#1e293b"/>
    </g>

    <!-- Corner Wrap Ghost (Seamless Tiling) -->
    <g transform="translate(-5, -5) scale(0.6)">
      <path fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" d="M 16 2 C 7 2, 2 9, 2 20 C 2 27, 4 34, 7 34 Z"/>
    </g>
    <g transform="translate(235, -5) scale(0.6)">
      <path fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" d="M 16 2 C 7 2, 2 9, 2 20 C 2 27, 4 34, 7 34 Z"/>
    </g>
    <g transform="translate(-5, 235) scale(0.6)">
      <path fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" d="M 16 2 C 7 2, 2 9, 2 20 C 2 27, 4 34, 7 34 Z"/>
    </g>
    <g transform="translate(235, 235) scale(0.6)">
      <path fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" d="M 16 2 C 7 2, 2 9, 2 20 C 2 27, 4 34, 7 34 Z"/>
    </g>

    <!-- Halloween Sparkles -->
    <path fill="#ff6b00" d="M120 35l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z"/>
    <circle cx="120" cy="115" r="2.5" fill="#ffb703"/>

  </g>
</svg>
