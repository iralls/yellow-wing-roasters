<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Balanced, widely-spaced festive holiday pattern tile (matches heart & champagne pattern frequency) -->
  <g fill-opacity="0.16">
    
    <!-- 1. Christmas Tree with Star Topper (Top Left) -->
    <g transform="translate(40, 35) scale(0.75)">
      <polygon fill="#2d5a27" points="16,4 4,20 10,20 2,34 8,34 0,48 32,48 24,34 30,34 22,20 28,20"/>
      <rect fill="#5c3d1a" x="13" y="48" width="6" height="8" rx="1"/>
      <polygon fill="#f0c838" points="16,0 17.5,3 21,3.5 18.5,6 19,9.5 16,8 13,9.5 13.5,6 11,3.5 14.5,3"/>
    </g>

    <!-- 2. Wrapped Gift Box / Present (Top Right) -->
    <g transform="translate(170, 45) scale(0.75)">
      <rect fill="#d90429" x="2" y="10" width="28" height="24" rx="2"/>
      <rect fill="#ef233c" x="0" y="6" width="32" height="6" rx="1"/>
      <rect fill="#f0c838" x="13" y="6" width="6" height="28"/>
      <rect fill="#f0c838" x="2" y="19" width="28" height="6"/>
      <path fill="#f0c838" d="M11 6c-3-4-7-3-6 0s6 4 8 4M21 6c3-4 7-3 6 0s-6 4-8 4"/>
    </g>

    <!-- 3. Star of David / Hanukkah Star (Bottom Left) -->
    <g transform="translate(45, 155) scale(0.8)">
      <polygon fill="#0077b6" points="16,2 30,26 2,26"/>
      <polygon fill="#0077b6" points="16,30 30,6 2,6"/>
      <circle cx="16" cy="16" r="3" fill="#90e0ef"/>
    </g>

    <!-- 4. Dreidel (Bottom Right) -->
    <g transform="translate(170, 150) scale(0.75)">
      <rect fill="#d4af37" x="10" y="0" width="4" height="6" rx="1"/>
      <polygon fill="#0096c7" points="2,6 22,6 18,18 6,18"/>
      <polygon fill="#0077b6" points="6,18 18,18 12,28"/>
      <path fill="#ffffff" d="M10 9h4v2h-2v4h-2z"/>
    </g>

    <!-- Corner Wrap Present (Seamless Tiling) -->
    <g transform="translate(-8, -8) scale(0.65)">
      <rect fill="#e63946" x="2" y="10" width="28" height="24" rx="2"/>
      <rect fill="#f0c838" x="13" y="6" width="6" height="28"/>
    </g>
    <g transform="translate(232, -8) scale(0.65)">
      <rect fill="#e63946" x="2" y="10" width="28" height="24" rx="2"/>
      <rect fill="#f0c838" x="13" y="6" width="6" height="28"/>
    </g>
    <g transform="translate(-8, 232) scale(0.65)">
      <rect fill="#e63946" x="2" y="10" width="28" height="24" rx="2"/>
      <rect fill="#f0c838" x="13" y="6" width="6" height="28"/>
    </g>
    <g transform="translate(232, 232) scale(0.65)">
      <rect fill="#e63946" x="2" y="10" width="28" height="24" rx="2"/>
      <rect fill="#f0c838" x="13" y="6" width="6" height="28"/>
    </g>

    <!-- Decorative Festive Sparkles & Snowflakes -->
    <circle cx="120" cy="115" r="2.5" fill="#0096c7"/>
    <path fill="#f0c838" d="M120 40l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/>
    <path fill="#d4af37" d="M120 185l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/>

  </g>
</svg>
