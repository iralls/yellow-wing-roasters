<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Mulled Feathers Winter Pattern (Snowflakes Only) -->
  <g fill-opacity="0.14" stroke-opacity="0.16">
    
    <!-- 1. Large 6-Point Crystal Snowflake (Top Left) -->
    <g transform="translate(45, 30) scale(0.9)" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" fill="none">
      <line x1="16" y1="2" x2="16" y2="30"/>
      <line x1="4" y1="9" x2="28" y2="23"/>
      <line x1="4" y1="23" x2="28" y2="9"/>
      <path d="M 12 6 L 16 10 L 20 6 M 12 26 L 16 22 L 20 26 M 6 14 L 10 16 L 8 20 M 26 14 L 22 16 L 24 20"/>
      <circle cx="16" cy="16" r="2" fill="#94a3b8" stroke="none"/>
    </g>

    <!-- 2. Medium Star Snowflake (Top Right) -->
    <g transform="translate(165, 45) scale(0.75)" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" fill="none">
      <line x1="16" y1="4" x2="16" y2="28"/>
      <line x1="4" y1="16" x2="28" y2="16"/>
      <line x1="7.5" y1="7.5" x2="24.5" y2="24.5"/>
      <line x1="7.5" y1="24.5" x2="24.5" y2="7.5"/>
      <path d="M 13 8 L 16 11 L 19 8 M 13 24 L 16 21 L 19 24 M 8 13 L 11 16 L 8 19 M 24 13 L 21 16 L 24 19"/>
    </g>

    <!-- 3. Medium Star Snowflake (Bottom Left) -->
    <g transform="translate(45, 155) scale(0.75)" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" fill="none">
      <line x1="16" y1="4" x2="16" y2="28"/>
      <line x1="4" y1="16" x2="28" y2="16"/>
      <line x1="7.5" y1="7.5" x2="24.5" y2="24.5"/>
      <line x1="7.5" y1="24.5" x2="24.5" y2="7.5"/>
      <path d="M 13 8 L 16 11 L 19 8 M 13 24 L 16 21 L 19 24 M 8 13 L 11 16 L 8 19 M 24 13 L 21 16 L 24 19"/>
    </g>

    <!-- 4. Large 6-Point Crystal Snowflake (Bottom Right) -->
    <g transform="translate(165, 150) scale(0.9)" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" fill="none">
      <line x1="16" y1="2" x2="16" y2="30"/>
      <line x1="4" y1="9" x2="28" y2="23"/>
      <line x1="4" y1="23" x2="28" y2="9"/>
      <path d="M 12 6 L 16 10 L 20 6 M 12 26 L 16 22 L 20 26 M 6 14 L 10 16 L 8 20 M 26 14 L 22 16 L 24 20"/>
      <circle cx="16" cy="16" r="2" fill="#94a3b8" stroke="none"/>
    </g>

    <!-- Corner Wrap Snowflake (Seamless Tiling) -->
    <g transform="translate(-5, -5) scale(0.7)" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" fill="none">
      <line x1="16" y1="2" x2="16" y2="30"/>
      <line x1="4" y1="9" x2="28" y2="23"/>
      <line x1="4" y1="23" x2="28" y2="9"/>
    </g>
    <g transform="translate(235, -5) scale(0.7)" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" fill="none">
      <line x1="16" y1="2" x2="16" y2="30"/>
      <line x1="4" y1="9" x2="28" y2="23"/>
      <line x1="4" y1="23" x2="28" y2="9"/>
    </g>
    <g transform="translate(-5, 235) scale(0.7)" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" fill="none">
      <line x1="16" y1="2" x2="16" y2="30"/>
      <line x1="4" y1="9" x2="28" y2="23"/>
      <line x1="4" y1="23" x2="28" y2="9"/>
    </g>
    <g transform="translate(235, 235) scale(0.7)" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" fill="none">
      <line x1="16" y1="2" x2="16" y2="30"/>
      <line x1="4" y1="9" x2="28" y2="23"/>
      <line x1="4" y1="23" x2="28" y2="9"/>
    </g>

    <!-- Floating Snow Dots -->
    <circle cx="120" cy="115" r="2.5" fill="#94a3b8"/>
    <circle cx="115" cy="40" r="1.8" fill="#cbd5e1"/>
    <circle cx="125" cy="190" r="1.8" fill="#cbd5e1"/>
    <circle cx="45" cy="95" r="1.5" fill="#cbd5e1"/>
    <circle cx="195" cy="95" r="1.5" fill="#cbd5e1"/>

  </g>
</svg>
