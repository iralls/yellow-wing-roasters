<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #888; }
  .card {
    width: 1200px; height: 630px; background: #faf8f5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0;
  }
  .circle {
    width: 140px; height: 140px; border-radius: 50%;
    background: linear-gradient(135deg, #0D0F1F 50%, #E99E00 50%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  .circle img { width: 82px; height: 82px; object-fit: contain; filter: brightness(0) invert(1); }
  .name {
    font-family: "Montserrat", sans-serif; font-weight: 900;
    font-size: 42px; color: #E99E00; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .sub {
    font-family: "Montserrat", sans-serif; font-weight: 500;
    font-size: 18px; color: #0D0F1F; letter-spacing: 0.25em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="circle"><img src="images/bean-feather-cleaned-white-transparent.png" alt=""></div>
    <div class="name">Yellow Wing</div>
    <div class="sub">Roasters</div>
  </div>
</body>
</html>
