<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Feather Logo Preview</title>
<style>
  body { font-family: system-ui; background: #ddd; padding: 2rem; display: flex; flex-direction: column; align-items: center; gap: 2rem; }
  h1 { font-size: 1.1rem; color: #333; margin: 0; }
  .grid { display: flex; gap: 3rem; flex-wrap: wrap; justify-content: center; }
  .option {
    width: 300px; padding: 2.5rem 1.5rem 2rem; border-radius: 12px;
    background: #faf8f5;
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }
  .option img { height: 9rem; width: auto; margin-bottom: 0.5rem; }
  .option .name {
    font-family: 'Montserrat', system-ui, sans-serif;
    font-weight: 900; font-size: 1rem;
    color: #f0c838;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .option .sub {
    font-family: 'Montserrat', system-ui, sans-serif;
    font-weight: 500; font-size: 0.5rem;
    color: #302010;
    letter-spacing: 0.25em; text-transform: uppercase;
  }
  .option .label { font-size: 0.65rem; color: #999; margin-top: 1rem; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;900&display=swap" rel="stylesheet">
</head>
<body>

<h1>Main Logo — Feather Options</h1>

<div class="grid">

  <div class="option">
    <img src="images/feather-transparent.png" alt="">
    <div class="name">Yellow Wing</div>
    <div class="sub">Roasters</div>
    <div class="label">Current — feather-transparent.png</div>
  </div>

  <div class="option">
    <img src="images/feather-horizontal-transparent.png" alt="">
    <div class="name">Yellow Wing</div>
    <div class="sub">Roasters</div>
    <div class="label">feather-horizontal-transparent.png</div>
  </div>

  <div class="option">
    <img src="images/audubon-feather-transparent.png" alt="">
    <div class="name">Yellow Wing</div>
    <div class="sub">Roasters</div>
    <div class="label">audubon-feather-transparent.png</div>
  </div>

</div>

</body>
</html>
