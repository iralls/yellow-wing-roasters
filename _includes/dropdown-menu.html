<div class="dropdown-menu" id="dropdown-menu">
  <button class="dropdown-toggle" id="dropdown-toggle" aria-label="Menu" aria-expanded="false">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="dropdown-items" id="dropdown-items">
    <div class="dropdown-group">
      <div class="dropdown-group-label" id="coffee-toggle">Coffee ▸</div>
      <div class="dropdown-subitems" id="coffee-subitems" style="display:none;">
      <a href="{{ '/roasts/' | relative_url }}" class="dropdown-item dropdown-subitem">All</a>
      <a href="{{ '/blends/' | relative_url }}" class="dropdown-item dropdown-subitem">Blends</a>
      <a href="{{ '/single-origins/' | relative_url }}" class="dropdown-item dropdown-subitem">Single Origins</a>
      <a href="{{ '/seasonals/' | relative_url }}" class="dropdown-item dropdown-subitem">Seasonals</a>
      <a href="{{ '/subscriptions/' | relative_url }}" class="dropdown-item dropdown-subitem">Subscriptions</a>
      <a href="{{ '/subscriptions/manage/' | relative_url }}" class="dropdown-item dropdown-subitem" style="padding-left: 2.5rem; opacity: 0.85;">Manage</a>
      <a href="{{ '/flights/' | relative_url }}" class="dropdown-item dropdown-subitem">Sample Packs</a>
      <a href="{{ '/gift/' | relative_url }}" class="dropdown-item dropdown-subitem">Gifts</a>
      </div>
    </div>
    <a href="{{ '/about/' | relative_url }}" class="dropdown-item">About Us</a>
    <a href="{{ '/partners/' | relative_url }}" class="dropdown-item">Partner Roasts</a>
    <a href="{{ '/pigeon-post/' | relative_url }}" class="dropdown-item">Mailing List</a>
    <a href="{{ '/feedback/' | relative_url }}" class="dropdown-item">Feedback</a>
  </div>
</div>
<script>
(function () {
  var toggle = document.getElementById('dropdown-toggle');
  var items = document.getElementById('dropdown-items');
  toggle.addEventListener('click', function () {
    var open = items.classList.toggle('dropdown-items--open');
    toggle.setAttribute('aria-expanded', open);
  });
  var coffeeToggle = document.getElementById('coffee-toggle');
  var coffeeItems = document.getElementById('coffee-subitems');
  coffeeToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = coffeeItems.style.display === 'none';
    coffeeItems.style.display = open ? '' : 'none';
    coffeeToggle.textContent = open ? 'Coffee ▾' : 'Coffee ▸';
  });

  document.addEventListener('click', function (e) {
    if (!document.getElementById('dropdown-menu').contains(e.target)) {
      items.classList.remove('dropdown-items--open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
