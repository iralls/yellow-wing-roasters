<!-- Streamlined Redesigned Footer (Menu Column Layout) -->
<footer class="sleek-bottom-nav-footer" id="streamlined-footer">
  <div class="sleek-footer-container">
    <div class="sleek-footer-grid streamlined-footer-grid">
      <!-- Col 1: Brand & Heritage -->
      <div class="sleek-footer-col sleek-footer-col--brand" id="streamlined-footer-brand">
        <a href="{{ '/' | relative_url }}" class="sleek-footer-brand-lockup" id="streamlined-brand-lockup">
          <img src="{{ '/images/audubon-feather-transparent.png' | relative_url }}" alt="Yellow Wing Roasters" class="sleek-footer-feather-icon" width="231" height="800">
          <div class="sleek-footer-brand-title brand-header-name">Yellow Wing</div>
          <div class="sleek-footer-brand-sub brand-header-sub">Roasters</div>
        </a>
        <p class="sleek-footer-tagline">
          {{ site.slogan }}
        </p>
      </div>

      <!-- Col 2: Contact -->
      <div class="sleek-footer-col">
        <div class="sleek-footer-heading">Contact</div>
        <ul class="sleek-footer-links-list">
          <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
        </ul>
      </div>

      <!-- Col 3: Pigeon Post -->
      <div class="sleek-footer-col sleek-footer-col--signup">
        <div class="sleek-footer-heading">Pigeon Post</div>
        <p class="sleek-footer-signup-desc">
          New micro-lots, seasonal roasts, and restocks delivered to your inbox.
        </p>
        <form action="{{ site.google_forms.pigeon_post.url }}" method="POST" class="sleek-footer-signup-form" id="streamlined-pigeon-post-form">
          <input type="email" name="{{ site.google_forms.pigeon_post.entries.email }}" placeholder="your@email.com" aria-label="Email address for Pigeon Post" autocomplete="email" required class="sleek-footer-signup-input">
          <button type="submit" class="sleek-footer-signup-btn" id="streamlined-pigeon-post-submit">Subscribe</button>
        </form>
        <div class="sleek-footer-signup-status" id="streamlined-pigeon-post-status" role="status" aria-live="polite"></div>
      </div>


    </div>

    <!-- Centered Quick Links (Used in Centered Quick Links variant) -->
    <nav class="streamlined-footer-quick-links" id="streamlined-footer-quick-links" aria-label="Footer Quick Links">
      <a href="{{ '/about/' | relative_url }}" class="streamlined-footer-quick-link">About Us</a>
      <span class="streamlined-footer-quick-sep" aria-hidden="true">•</span>
      <a href="{{ '/pigeon-post/' | relative_url }}" class="streamlined-footer-quick-link">Pigeon Post</a>
      <span class="streamlined-footer-quick-sep" aria-hidden="true">•</span>
      <a href="{{ '/order/' | relative_url }}" class="streamlined-footer-quick-link streamlined-footer-quick-link--cart" id="streamlined-footer-cart-link">Cart</a>
    </nav>

    <!-- Bottom Bar: Classic brand feather icon & est 2026 -->
    <div class="sleek-footer-bottom-bar" id="streamlined-footer-bottom-bar">
      <a href="{{ '/' | relative_url }}" class="site-footer-link site-footer-mark">
        <img src="{{ '/images/audubon-feather-transparent.png' | relative_url }}" alt="Yellow Wing Roasters" class="site-footer-logo-icon" width="231" height="800" loading="lazy" decoding="async">
        <div class="site-footer-est">est 2026</div>
      </a>
    </div>
  </div>
</footer>

<script>
  (function () {
    var cartLink = document.getElementById('streamlined-footer-cart-link');
    if (cartLink) {
      cartLink.addEventListener('click', function (e) {
        if (typeof window.ywrOpenCartDrawer === 'function') {
          e.preventDefault();
          window.ywrOpenCartDrawer();
        }
      });
    }

    var form = document.getElementById('streamlined-pigeon-post-form');
    if (!form) return;
    var status = document.getElementById('streamlined-pigeon-post-status');
    var submitBtn = document.getElementById('streamlined-pigeon-post-submit');

    var iframe = document.createElement('iframe');
    iframe.name = 'streamlined-pigeon-post-frame';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    form.target = 'streamlined-pigeon-post-frame';

    form.addEventListener('submit', function () {
      if (status) {
        status.textContent = 'Sending…';
        status.style.color = '#776558';
      }
      if (submitBtn) submitBtn.disabled = true;

      iframe.onload = function () {
        form.style.display = 'none';
        var desc = form.previousElementSibling;
        if (desc && desc.classList.contains('sleek-footer-signup-desc')) desc.style.display = 'none';
        if (status) {
          status.textContent = "You're subscribed! Keep an eye on your inbox. 🕊️";
          status.style.color = '#2e7d32';
          status.style.fontWeight = '700';
        }
      };
    });
  })();
</script>
