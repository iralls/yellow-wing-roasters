---
layout: default
---

<div class="roast-minimal-vertical">

<div class="roast-mv-divider"></div>

{% if page.mascot_file %}
<div class="roast-mv-center roast-mv-bird-wrap">
  <img src="{{ '/images/' | append: page.mascot_file | relative_url }}" alt="" class="roast-mv-bird" aria-hidden="true" fetchpriority="high" decoding="async">
</div>
{% endif %}

<div class="roast-mv-center">
  <h1 class="roast-mv-title">{{ page.title }}</h1>
</div>

{% if page.subtitle %}
<p class="roast-mv-tasting">{{ page.subtitle }}</p>
{% endif %}

<div class="roast-mv-divider"></div>

<div class="roast-mv-body">
  {{ content }}
</div>

<div class="roast-mv-center" style="margin-top:1rem;">
  <a href="{{ '/subscribe/?roast=' | append: page.slug | relative_url }}" class="add-to-order-btn">Subscribe — ${{ page.price["12oz"] | default: page.price }}/mo</a>
</div>

</div>
